        <body>
        <section id="contacto" class="contact-section">
    <div class="contact-container">
        <div class="contact-header">
            <h2>Ponte en Contacto</h2>
            <p>¿Tienes algún proyecto en mente o necesitas una solución web? Escríbenos y nos pondremos en contacto contigo lo antes posible.</p>
        </div>

        <form id="contactForm" class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Roberto Juárez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" placeholder="¿De qué trata tu proyecto?" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos los detalles de lo que necesitas..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Mensaje</button>
        </form>
    </div>
</section>
